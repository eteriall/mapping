name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mapping_test
          POSTGRES_USER: mapping
          POSTGRES_PASSWORD: mapping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapping -d mapping_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: http://localhost
      DB_NAME: mapping_test
      DB_USER: mapping
      DB_PASSWORD: mapping
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      MEDIA_ROOT: /tmp/mapping-media
      MAX_UPLOAD_BYTES: "524288000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python backend/server/manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
